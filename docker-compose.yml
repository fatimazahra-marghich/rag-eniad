services:
  api:
    build: .
    image: rag-eniad:local
    ports:
      - "8000:8080"
    env_file:
      - .env
    environment:
      PORT: "8080"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3